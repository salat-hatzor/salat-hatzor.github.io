<style>
  :root {
    --bg: #fbf6ea;
    --card: #ffffff;
    --ink: #2b2a24;
    --muted: #6f6a5c;
    --line: #e8dfc8;
    --green: #2f6b2a;
    --green-soft: #e6f0df;
    --red: #8e1c1c;
    --red-soft: #f6e3e0;
    --gold: #c8a24a;
    --wa: #1f9d55;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Rubik", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding-bottom: 96px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  header {
    text-align: center;
    padding: 12px 12px 20px;
    background: var(--bg);
  }
  header .hero {
    display: block; width: 100%; max-width: 640px; height: auto;
    margin: 0 auto 14px; border-radius: 16px;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .badge {
    background: var(--green); color: #fff; border-radius: 999px;
    padding: 5px 12px; font-size: 13px; font-weight: 500;
  }
  .badge.deliver { background: var(--red); }
  .note {
    margin: 16px auto 0; background: #fff; border: 1px dashed var(--gold);
    border-radius: 10px; padding: 8px 12px; font-size: 14px; color: var(--muted);
    max-width: 420px;
  }

  section.cat { margin-top: 22px; }
  .cat-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 20px; font-weight: 700; color: #fff;
    padding: 8px 14px; border-radius: 12px 12px 0 0;
  }
  .cat.raw .cat-title { background: var(--green); }
  .cat.cooked .cat-title { background: var(--red); }
  .list {
    background: var(--card); border: 1px solid var(--line); border-top: 0;
    border-radius: 0 0 12px 12px;
  }
  .item { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item-name { font-weight: 500; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .new {
    background: var(--red); color: #fff; font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 6px;
  }
  .sizes { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; }
  .size {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border-radius: 10px; padding: 5px 6px 5px 10px;
  }
  .size.on { background: var(--green-soft); }
  .cat.cooked .size.on { background: var(--red-soft); }
  .size-label { font-size: 14px; color: var(--muted); min-width: 92px; }
  .size-label b { color: var(--ink); font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    font: 700 20px/1 "Rubik", sans-serif; cursor: pointer;
  }
  .stepper button.plus { background: var(--green); border-color: var(--green); color: #fff; }
  .cat.cooked .stepper button.plus { background: var(--red); border-color: var(--red); }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .qty { min-width: 22px; text-align: center; font-weight: 700; }

  form {
    margin-top: 26px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
  }
  form h2 { margin: 0 0 4px; font-size: 20px; color: var(--green); }
  .field { margin-top: 12px; }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  input, textarea {
    width: 100%; font: 16px "Rubik", sans-serif; color: var(--ink);
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fffdf8;
  }
  input:focus, textarea:focus { outline: 2px solid var(--green); border-color: transparent; }
  textarea { min-height: 70px; resize: vertical; }
  .err { color: var(--red); font-size: 13px; margin-top: 4px; display: none; }
  .field.bad .err { display: block; }
  .field.bad input { border-color: var(--red); }

  .summary { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 15px; padding: 2px 0; }
  .summary-row.total { font-weight: 800; font-size: 18px; margin-top: 6px; }
  .empty { color: var(--muted); font-size: 14px; }

  .send {
    margin-top: 16px; width: 100%; border: 0; border-radius: 12px;
    background: var(--wa); color: #fff; font: 700 18px "Rubik", sans-serif;
    padding: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .send svg { width: 22px; height: 22px; fill: currentColor; }
  .form-err { color: var(--red); font-size: 14px; margin-top: 8px; text-align: center; display: none; }

  .contact { text-align: center; color: var(--muted); font-size: 14px; margin: 24px 0 8px; }
  .contact a { color: var(--green); font-weight: 700; text-decoration: none; }

  .bar {
    position: fixed; inset: auto 0 0 0; background: var(--green); color: #fff;
    padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 -4px 14px rgba(0,0,0,.15);
    transform: translateY(110%); transition: transform .25s;
  }
  .bar.show { transform: none; }
  .bar .t { font-weight: 700; font-size: 17px; }
  .bar .c { font-size: 13px; opacity: .85; }
  .bar button {
    background: #fff; color: var(--green); border: 0; border-radius: 10px;
    font: 700 15px "Rubik", sans-serif; padding: 9px 14px; cursor: pointer;
  }
</style>

        qty[key] = 0;
        const box = document.createElement("div");
        box.className = "size";
        box.innerHTML = `
          <span class="size-label">${SIZES[sz]} · <b>₪${it[sz]}</b></span>
          <span class="stepper">
            <button type="button" class="minus" aria-label="פחות" disabled>−</button>
            <span class="qty">0</span>
            <button type="button" class="plus" aria-label="עוד">+</button>
          </span>`;
        const q = box.querySelector(".qty");
        const minus = box.querySelector(".minus");
        const set = n => {
          qty[key] = n;
          q.textContent = n;
          minus.disabled = n === 0;
          box.classList.toggle("on", n > 0);
          update();
        };
        box.querySelector(".plus").onclick = () => set(qty[key] + 1);
        minus.onclick = () => set(Math.max(0, qty[key] - 1));
        sizes.appendChild(box);
      });
      list.appendChild(row);
    });
    menuEl.appendChild(sec);
  });

  function lines() {
    const out = [];
    for (const key in qty) {
      if (!qty[key]) continue;
      const [gi, ii, sz] = key.split("-");
      const it = MENU[gi].items[ii];
      out.push({ name: it.name, size: SIZES[sz], n: qty[key], sum: qty[key] * it[sz] });
    }
    return out;
  }

  function update() {
    const ls = lines();
    const total = ls.reduce((a, b) => a + b.sum, 0);
    const count = ls.reduce((a, b) => a + b.n, 0);
    document.getElementById("summary").innerHTML = ls.length
      ? ls.map(l => `<div class="summary-row"><span>${l.name} · ${l.size} × ${l.n}</span><span>₪${l.sum}</span></div>`).join("")
        + `<div class="summary-row total"><span>סה"כ</span><span>₪${total}</span></div>`
      : `<div class="empty">עוד לא נבחרו סלטים</div>`;
    document.getElementById("barTotal").textContent = `סה"כ ₪${total}`;
    document.getElementById("barCount").textContent = `${count} פריטים`;
    document.getElementById("bar").classList.toggle("show", count > 0);
    if (count) document.getElementById("formErr").style.display = "none";
  }
  update();

  document.getElementById("toForm").onclick = () =>
    document.getElementById("order").scrollIntoView({ behavior: "smooth" });

  document.getElementById("order").addEventListener("submit", e => {
    e.preventDefault();
    const f = id => document.getElementById(id);
    const checks = {
      name: v => v.trim().length >= 2,
      phone: v => v.replace(/\D/g, "").length >= 9,
      address: v => v.trim().length >= 3,
    };
    let ok = true;
    for (const id in checks) {
      const good = checks[id](f(id).value);
      f(id).closest(".field").classList.toggle("bad", !good);
      if (!good) ok = false;
    }
    const ls = lines();
    f("formErr").style.display = ls.length ? "none" : "block";
    if (!ok || !ls.length) return;

    const total = ls.reduce((a, b) => a + b.sum, 0);
    const msg = [
      "שלום יוסף, הזמנת סלטים לשבת:",
      "",
      ...ls.map(l => `• ${l.name} – ${l.size} × ${l.n} (₪${l.sum})`),
      "",
      `סה"כ: ₪${total}`,
      "",
      `שם: ${f("name").value.trim()}`,
      `טלפון: ${f("phone").value.trim()}`,
      `כתובת: ${f("address").value.trim()}`,
      f("notes").value.trim() ? `הערות: ${f("notes").value.trim()}` : "",
    ].filter((x, i, a) => !(x === "" && a[i - 1] === "")).join("\n").trim();

    window.location.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
  });
</script>
</body>
</html>
